name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arm64:
    name: Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          brew install ninja qt capstone
          # --retry, because this download is a single point of failure with no fallback:
          # it answered HTTP 500 once (run 34347238871) and failed a job whose own work was
          # already done. Retrying an asset fetch is safe -- it is a plain GET of an immutable
          # release asset.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o cmkr.zip \
            "$(gh release view --repo build-cpp/cmkr --json assets \
               --jq '.assets[] | select(.name | test("macos")) | .url')"
          unzip -o cmkr.zip -d /usr/local/bin
          chmod +x /usr/local/bin/cmkr
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify the toolchain
        run: |
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"
          QT_ROOT_DIR="$(brew --prefix qt)" ./scripts/check-toolchain.sh

      - name: Verify the vendored tree and the credits
        run: |
          ./scripts/verify-vendor.sh
          ./scripts/check-credits.sh

      - name: Configure
        working-directory: src/cross
        run: cmake --preset macos-arm64 -DMACHBUG_BUILD_TESTS=ON

      # regview is in this list because check-bundles.sh and smoke-launch.sh both cover it now:
      # a bundle that is checked but never built fails as "has no executable", which is what
      # adding it to those scripts without adding it here produced.
      - name: Build the Qt samples
        working-directory: src/cross
        run: cmake --build build/macos-arm64 --target hex_viewer minidump remote_table release_notes regview

      # These run as the ordinary runner user, deliberately. Milestone 0 assumed engine
      # tests would need root, because task_for_pid usually does. Milestone 2 task 1
      # measured otherwise: a same-user caller reaches a target signed with
      # get-task-allow without any entitlement or elevation, and every fixture is signed
      # that way at build time. Do not add sudo here -- it would hide a real regression
      # in the fixtures' signing behind elevated privilege.
      - name: Build the contract tests
        working-directory: src/cross
        run: cmake --build build/macos-arm64 --target MachBug_tests

      # Bounded separately from the build above, and tightly: a normal run finishes in
      # seconds. Milestone 2 task 6 found (and fixed) one real blocking-wait bug that could
      # hang the whole process indefinitely at near-zero CPU -- an uninterruptible kernel
      # wait, not a spin -- and it exits 0 whether it stalls for a second first or fifteen
      # minutes. This timeout is the safety net for that entire class of bug, independent of
      # which wait turns out to be the cause: a stall here now fails this step loudly within
      # minutes, at this named location, instead of silently costing fifteen minutes of CI
      # time before passing anyway.
      - name: Run the contract tests
        working-directory: src/cross
        timeout-minutes: 3
        run: ./build/macos-arm64/tests/MachBug_tests

      # The view, checked the only way a job can check one. A screenshot proves a populated
      # register table to a person and nothing here; these two run the whole app offscreen
      # against a real target and exit non-zero if what the widgets are showing is empty --
      # or, for the second one, if the target never stops on a breakpoint the bench set.
      - name: Self-test the views
        working-directory: src/cross
        timeout-minutes: 3
        run: |
          QT_QPA_PLATFORM=offscreen ./build/macos-arm64/regview.app/Contents/MacOS/regview \
              --selftest build/macos-arm64/tests/targets/run_endlessly
          QT_QPA_PLATFORM=offscreen ./build/macos-arm64/regview.app/Contents/MacOS/regview \
              --selftest-breakpoint build/macos-arm64/tests/targets/known_function

      - name: Verify the bundles
        run: ./scripts/check-bundles.sh

      # scripts/check-build-warnings.sh is deliberately not run here. It performs its own
      # full clean configure-and-build of all four Qt targets in a fresh temporary directory
      # to capture and diff the linker warning set, which would double this job's ~5 minute
      # build (plus four ~90 MB macdeployqt copies) for a check whose only value over the
      # build above is asserting the *exact* warning set rather than merely tolerating
      # warnings. Run it locally, or as a separate on-demand job, if that assertion is ever
      # needed in CI.
      #
      # This runner installs Qt via Homebrew, so the smoke-launch step below proves the
      # bundles start and their load commands resolve -- it does not prove they run on a
      # machine with no Qt installed, which is what macdeployqt exists to achieve and what
      # the eventual definition of done needs.
      - name: Smoke-launch
        run: MACHDBG_SMOKE_OFFSCREEN=1 ./scripts/smoke-launch.sh

  intel:
    name: Intel (answers research question 3)
    runs-on: macos-15-intel
    # continue-on-error is gone as of milestone 3 task 8. It was right while this job only ran
    # uname and sw_vers to answer whether an Intel runner exists at all: a job that asserts
    # nothing should not be able to fail the build. It now runs the engine tests, which is the
    # only proof the x86-64 half of the port works, so it has to be able to fail. If this image
    # ever disappears, the fallback is the `unverified` label the design document's definition of
    # done already names -- a decision to take then, not one to pre-forgive here.
    steps:
      - uses: actions/checkout@v4
      - name: Report the runner
        run: |
          uname -m
          sw_vers

      # Qt is needed even though nothing in this job builds a Qt target: src/cross's manifest
      # adds the widgets subdirectory unconditionally, so configure itself needs it.
      - name: Install the toolchain
        run: |
          brew install ninja qt capstone
          # --retry, because this download is a single point of failure with no fallback:
          # it answered HTTP 500 once (run 34347238871) and failed a job whose own work was
          # already done. Retrying an asset fetch is safe -- it is a plain GET of an immutable
          # release asset.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 2 -o cmkr.zip \
            "$(gh release view --repo build-cpp/cmkr --json assets \
               --jq '.assets[] | select(.name | test("macos")) | .url')"
          unzip -o cmkr.zip -d /usr/local/bin
          chmod +x /usr/local/bin/cmkr
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify the toolchain
        run: |
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"
          QT_ROOT_DIR="$(brew --prefix qt)" ./scripts/check-toolchain.sh

      # The macos-x86_64 preset, not macos-arm64: that one pins CMAKE_OSX_ARCHITECTURES to arm64,
      # so using it here would cross-compile a binary this runner cannot execute -- and the tests
      # would never run at all, which is exactly the outcome this job exists to prevent.
      - name: Configure
        working-directory: src/cross
        run: cmake --preset macos-x86_64 -DMACHBUG_BUILD_TESTS=ON

      # As the ordinary runner user, no sudo, for the reason the Apple Silicon job states above:
      # the fixtures are signed with get-task-allow at build time, and that is what task_for_pid
      # needs. Elevating here would hide a regression in the fixtures' signing.
      - name: Build the engine tests
        working-directory: src/cross
        run: cmake --build build/macos-x86_64 --target MachBug_tests

      # This is where the x86-64 register file stops being compiled-but-unproven: milestone 3's
      # arch/X86_64.cpp has assertions that compile out on Apple Silicon, and this is the only
      # place they run. Bounded for the same reason the Apple Silicon job is.
      - name: Run the engine tests
        working-directory: src/cross
        timeout-minutes: 5
        run: ./build/macos-x86_64/tests/MachBug_tests

      # Only on failure, and only diagnostics: a red run on a machine nobody owns is otherwise a
      # bare assertion failure with no way to tell an environment result from a code defect.
      # Fixture entitlements answer "is this a signing problem", and the exception/crash log
      # answers "did the kernel refuse to deliver what the engine waited for".
      - name: Diagnose a failure
        if: failure()
        working-directory: src/cross
        run: |
          echo "== fixture entitlements =="
          for fixture in build/macos-x86_64/tests/targets/*; do
            [ -x "$fixture" ] || continue
            echo "--- $fixture"
            codesign --display --entitlements - "$fixture" 2>&1 | tail -5
          done
          echo "== recent exception and crash activity =="
          log show --last 10m --predicate 'eventMessage CONTAINS "EXC_" OR process == "ReportCrash"' \
            --style compact 2>&1 | tail -40 || true
