name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arm64:
    name: Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          brew install ninja qt capstone
          curl -sSfL -o cmkr.zip \
            "$(gh release view --repo build-cpp/cmkr --json assets \
               --jq '.assets[] | select(.name | test("macos")) | .url')"
          unzip -o cmkr.zip -d /usr/local/bin
          chmod +x /usr/local/bin/cmkr
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify the toolchain
        run: |
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"
          QT_ROOT_DIR="$(brew --prefix qt)" ./scripts/check-toolchain.sh

      - name: Verify the vendored tree and the credits
        run: |
          ./scripts/verify-vendor.sh
          ./scripts/check-credits.sh

      - name: Configure
        working-directory: src/cross
        run: cmake --preset macos-arm64 -DMACHBUG_BUILD_TESTS=ON

      - name: Build the Qt samples
        working-directory: src/cross
        run: cmake --build build/macos-arm64 --target hex_viewer minidump remote_table release_notes

      # These run as the ordinary runner user, deliberately. Milestone 0 assumed engine
      # tests would need root, because task_for_pid usually does. Milestone 2 task 1
      # measured otherwise: a same-user caller reaches a target signed with
      # get-task-allow without any entitlement or elevation, and every fixture is signed
      # that way at build time. Do not add sudo here -- it would hide a real regression
      # in the fixtures' signing behind elevated privilege.
      - name: Build the contract tests
        working-directory: src/cross
        run: cmake --build build/macos-arm64 --target MachBug_tests

      # Bounded separately from the build above, and tightly: a normal run finishes in
      # seconds. Milestone 2 task 6 found (and fixed) one real blocking-wait bug that could
      # hang the whole process indefinitely at near-zero CPU -- an uninterruptible kernel
      # wait, not a spin -- and it exits 0 whether it stalls for a second first or fifteen
      # minutes. This timeout is the safety net for that entire class of bug, independent of
      # which wait turns out to be the cause: a stall here now fails this step loudly within
      # minutes, at this named location, instead of silently costing fifteen minutes of CI
      # time before passing anyway.
      - name: Run the contract tests
        working-directory: src/cross
        timeout-minutes: 3
        run: ./build/macos-arm64/tests/MachBug_tests

      - name: Verify the bundles
        run: ./scripts/check-bundles.sh

      # scripts/check-build-warnings.sh is deliberately not run here. It performs its own
      # full clean configure-and-build of all four Qt targets in a fresh temporary directory
      # to capture and diff the linker warning set, which would double this job's ~5 minute
      # build (plus four ~90 MB macdeployqt copies) for a check whose only value over the
      # build above is asserting the *exact* warning set rather than merely tolerating
      # warnings. Run it locally, or as a separate on-demand job, if that assertion is ever
      # needed in CI.
      #
      # This runner installs Qt via Homebrew, so the smoke-launch step below proves the
      # bundles start and their load commands resolve -- it does not prove they run on a
      # machine with no Qt installed, which is what macdeployqt exists to achieve and what
      # the eventual definition of done needs.
      - name: Smoke-launch
        run: MACHDBG_SMOKE_OFFSCREEN=1 ./scripts/smoke-launch.sh

  intel:
    name: Intel (answers research question 3)
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Report the runner
        run: |
          uname -m
          sw_vers
