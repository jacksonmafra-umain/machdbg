name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arm64:
    name: Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          brew install ninja qt capstone
          curl -sSfL -o cmkr.zip \
            "$(gh release view --repo build-cpp/cmkr --json assets \
               --jq '.assets[] | select(.name | test("macos")) | .url')"
          unzip -o cmkr.zip -d /usr/local/bin
          chmod +x /usr/local/bin/cmkr
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify the toolchain
        run: |
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"
          QT_ROOT_DIR="$(brew --prefix qt)" ./scripts/check-toolchain.sh

      - name: Verify the vendored tree and the credits
        run: |
          ./scripts/verify-vendor.sh
          ./scripts/check-credits.sh

      - name: Configure
        working-directory: src/cross
        run: cmake --preset macos-arm64 -DMACHBUG_BUILD_TESTS=ON

      - name: Build the Qt samples
        working-directory: src/cross
        run: cmake --build build/macos-arm64 --target hex_viewer minidump remote_table release_notes

      # Runs as the ordinary runner user -- no sudo, and none should be added back. Milestone 0's
      # plan assumed task_for_pid needed root or an Apple-issued identity with
      # com.apple.security.cs.debugger. Task 1 measured otherwise: a same-user caller with no
      # debugger entitlement reaches a target ad-hoc signed with com.apple.security.get-task-allow
      # (every fixture under MachBug/tests/targets is signed that way in cmake.toml), and
      # get-task-allow is exactly what buys that access. Root would only be needed to reach a
      # target that withheld get-task-allow, which is not this suite's fixtures.
      #
      # This step is also this milestone's core experiment, not just its test runner: every local
      # attempt to make macOS deliver a Mach exception to a registered task exception port failed
      # in this sandbox (task_set_exception_ports succeeds, the child faults for real, mach_msg
      # times out -- ReportCrash intercepts instead per `log show`). A GitHub Actions macOS runner
      # is a full VM rather than a sandboxed process, so the two exception tests below (in
      # MachBug/tests/exception_loop.cpp) may finally be able to observe real delivery here. Do
      # NOT weaken, skip, or mark these tests as expected-to-fail to force this job green -- if
      # the runner hits the same wall, red here is the answer the milestone needs, not a defect to
      # paper over. See exception_loop.cpp's reportNoFirstStop() for what a failure here means and
      # the diagnostic step below for the log-level evidence.
      - name: Build and run the MachBug engine tests
        working-directory: src/cross
        run: |
          cmake --build build/macos-arm64 --target MachBug_tests
          ./build/macos-arm64/tests/MachBug_tests

      # Only runs when the step above failed. Not required for the milestone's exit criteria --
      # it exists purely to make a red run legible without anyone having to reproduce it locally:
      # if the exception tests failed because no Mach exception ever reached the registered port,
      # ReportCrash (or another system handler) intercepting it in its place is the signature that
      # distinguishes "the OS took the exception instead of us" from an unrelated code defect. See
      # the task report for how this was used to diagnose the same failure locally.
      - name: Diagnose exception delivery (only runs if the engine tests failed)
        if: failure()
        run: |
          echo "---- entitlements on the exception_loop fixtures ----"
          codesign -d --entitlements :- src/cross/build/macos-arm64/tests/targets/hello_machbug || true
          codesign -d --entitlements :- src/cross/build/macos-arm64/tests/targets/run_endlessly || true
          echo "---- recent crash/exception handling activity (best effort; may be empty without sudo) ----"
          log show --last 5m --predicate 'process == "ReportCrash" OR eventMessage CONTAINS "EXC_"' \
            --style compact || true

      - name: Verify the bundles
        run: ./scripts/check-bundles.sh

      # scripts/check-build-warnings.sh is deliberately not run here. It performs its own
      # full clean configure-and-build of all four Qt targets in a fresh temporary directory
      # to capture and diff the linker warning set, which would double this job's ~5 minute
      # build (plus four ~90 MB macdeployqt copies) for a check whose only value over the
      # build above is asserting the *exact* warning set rather than merely tolerating
      # warnings. Run it locally, or as a separate on-demand job, if that assertion is ever
      # needed in CI.
      #
      # This runner installs Qt via Homebrew, so the smoke-launch step below proves the
      # bundles start and their load commands resolve -- it does not prove they run on a
      # machine with no Qt installed, which is what macdeployqt exists to achieve and what
      # the eventual definition of done needs.
      - name: Smoke-launch
        run: MACHDBG_SMOKE_OFFSCREEN=1 ./scripts/smoke-launch.sh

  intel:
    name: Intel (answers research question 3)
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Report the runner
        run: |
          uname -m
          sw_vers
