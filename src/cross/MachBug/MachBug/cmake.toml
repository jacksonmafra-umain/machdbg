# Reference: https://build-cpp.github.io/cmkr/cmake-toml
#
# Unlike ElfBug -- whose static library target is declared inline in src/cross/cmake.toml,
# because upstream vendored it that way -- MachBug is authored code and gets its own manifest,
# one directory per concern, matching the process/core/types split inside it.
[cmake]
version = "3.19"
cmkr-include = false

[project]
name = "MachBug"
languages = ["CXX"]

[target.MachBug]
type = "static"
sources = ["process/*.cpp", "core/*.cpp", "api/*.cpp", "arch/*.cpp", "memory/*.cpp", "macho/*.cpp"]
headers = ["types/*.h", "process/*.h", "core/*.h", "api/*.h", "arch/*.h", "memory/*.h", "macho/*.h"]
compile-features = ["cxx_std_17"]
include-directories = ["../"]
# MachBugMig.cmake is included (and its machbug_mig target defined) here, in the library that
# actually implements the exception loop -- not only from tests/cmake.toml, which is where it
# lived through Task 3 (machbug_mig existed only to prove the generated server linked; nothing in
# the library itself called into it yet). Debugger.Loop.cpp and ExceptionServer.cpp now #include
# the generated mach_exc.h and call mach_exc_server(), so MachBug itself needs machbug_mig's
# generated header and archive. include-before runs before this target's own add_library() call,
# so the machbug_mig target it defines exists in time to be listed below in link-libraries.
# src/cross/CMakeLists.txt adds this subdirectory (MachBug/MachBug) before MachBug/tests, so
# machbug_mig is already a defined CMake target by the time tests/CMakeLists.txt lists it again in
# its own link-libraries -- see that file's comment for why it does not also re-include
# MachBugMig.cmake.
#
# A `-Wl,-u,_catch_mach_exception_raise_state_identity` link option briefly lived here (see the
# task report for why: a lazy, single-pass static linker resolved mach_excServer.c.o's reference
# to that symbol using MachBugMigStubs.c.o's weak fallback, in the same archive, without ever
# extracting ExceptionServer.cpp.o's strong definition from libMachBug.a at all). It is gone now
# because the weak fallback it was working around is gone too -- MachBugMigStubs.c no longer
# defines catch_mach_exception_raise_state_identity at all (see that file's own comment); a
# missing or mis-linked strong handler is now a hard undefined-symbol error at build time, which
# is a better failure mode than either the silent one this once was or a linker flag working
# around a competing definition that should not exist any more.
include-before = ["../cmake/MachBugMig.cmake"]
# Threads::Threads: deferred by Task 3 (its multi_threaded fixture needed it before this library
# did) -- Debugger.Loop.cpp's command queue is a std::mutex/std::condition_variable, and Start()
# is documented to run on a caller-owned thread, so this library links pthread explicitly rather
# than relying on it coming in transitively from something else that happens to.
link-libraries = ["machbug_mig", "Threads::Threads"]
