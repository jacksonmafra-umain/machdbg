# Reference: https://build-cpp.github.io/cmkr/cmake-toml
[cmake]
version = "3.19"
cmkr-include = false

[project]
name = "MachBug_tests"
languages = ["C", "CXX"]

[fetch-content.Catch2]
git = "https://github.com/catchorg/Catch2"
tag = "v3.14.0"
shallow = true

# macOS-specific step ElfBug_tests' elfbug_fixture template does not need: an ad-hoc signature
# alone does not satisfy task_for_pid, and a fixture relinked by a later build loses whatever
# signature it had. Signing runs as a POST_BUILD command on every fixture target so it reapplies
# on every rebuild, not just the first one.
[template.machbug_fixture]
type = "executable"
compile-options = ["-g", "-O0"]
cmake-after = """
set_target_properties(${CMKR_TARGET} PROPERTIES
    RUNTIME_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/tests/targets"
)
add_custom_command(TARGET ${CMKR_TARGET} POST_BUILD
    COMMAND codesign --force --sign - --entitlements
            "${CMAKE_CURRENT_SOURCE_DIR}/targets.entitlements"
            "$<TARGET_FILE:${CMKR_TARGET}>"
    COMMENT "Signing ${CMKR_TARGET} with get-task-allow"
)
"""

[target.machbug_fixture_end_immediately]
type = "machbug_fixture"
sources = ["targets/end_immediately.cpp"]
properties.OUTPUT_NAME = "end_immediately"

[target.machbug_fixture_exit_code_42]
type = "machbug_fixture"
sources = ["targets/exit_code_42.cpp"]
properties.OUTPUT_NAME = "exit_code_42"

[target.machbug_fixture_hello_machbug]
type = "machbug_fixture"
sources = ["targets/hello_machbug.cpp"]
properties.OUTPUT_NAME = "hello_machbug"

[target.machbug_fixture_run_endlessly]
type = "machbug_fixture"
sources = ["targets/run_endlessly.cpp"]
properties.OUTPUT_NAME = "run_endlessly"

[target.machbug_fixture_multi_threaded]
type = "machbug_fixture"
sources = ["targets/multi_threaded.cpp"]
link-libraries = ["Threads::Threads"]
properties.OUTPUT_NAME = "multi_threaded"

[target.machbug_fixture_known_globals]
type = "machbug_fixture"
sources = ["targets/known_globals.cpp"]
properties.OUTPUT_NAME = "known_globals"

[target.machbug_fixture_known_function]
type = "machbug_fixture"
sources = ["targets/known_function.cpp"]
properties.OUTPUT_NAME = "known_function"

[target.machbug_fixture_crash_bad_access]
type = "machbug_fixture"
sources = ["targets/crash_bad_access.cpp"]
properties.OUTPUT_NAME = "crash_bad_access"

# The one fixture that must NOT carry get-task-allow: the task_for_pid denial regression test
# (debugger_launch.cpp) needs a target task_for_pid is expected to be denied against. Ad-hoc
# signing (no --entitlements) is still required -- an unsigned binary does not run at all on
# Apple Silicon -- but omitting the entitlement is what reproduces the measured KERN_FAILURE
# case from docs/specs/2026-09-07-macos-port-design.md, section 9.
[template.machbug_fixture_no_task_allow]
type = "executable"
compile-options = ["-g", "-O0"]
cmake-after = """
set_target_properties(${CMKR_TARGET} PROPERTIES
    RUNTIME_OUTPUT_DIRECTORY "${CMAKE_BINARY_DIR}/tests/targets"
)
add_custom_command(TARGET ${CMKR_TARGET} POST_BUILD
    COMMAND codesign --force --sign - "$<TARGET_FILE:${CMKR_TARGET}>"
    COMMENT "Signing ${CMKR_TARGET} ad-hoc WITHOUT get-task-allow (deliberate -- see targets/no_get_task_allow.cpp)"
)
"""

[target.machbug_fixture_no_get_task_allow]
type = "machbug_fixture_no_task_allow"
sources = ["targets/no_get_task_allow.cpp"]
properties.OUTPUT_NAME = "no_get_task_allow"

[target.MachBug_tests]
type = "executable"
sources = ["api_contract.cpp", "api_contract_c.c", "targets_signed.cpp", "mig_exception_server.cpp", "debugger_launch.cpp", "exception_loop.cpp", "test_harness.cpp", "thread_resolution.cpp", "registers_arm64.cpp", "registers_x86_64.cpp", "memory.cpp", "register_format.cpp", "stepping.cpp", "breakpoints_software.cpp"]
headers = ["TestHarness.h"]
compile-features = ["cxx_std_17"]
# ../ for MachBug/... includes, ../../ for <views/RegisterFormat.h>: the Qt-free half of the
# register view is covered here rather than in a Qt test target (see views/cmake.toml).
include-directories = ["../", "../../"]
# machbug_mig is defined in MachBug/MachBug/cmake.toml now (Task 4 -- MachBug itself needs
# mach_exc.h too, see that file's comment), and MachBug/MachBug is add_subdirectory'd before
# MachBug/tests in src/cross/CMakeLists.txt, so the target already exists here: this file no
# longer includes MachBugMig.cmake itself. Doing so here as well would call add_library(machbug_mig
# ...) a second time and fail to configure ("target already exists"). mig_exception_server.cpp
# still #includes the generated mach_exc.h directly, which is why machbug_mig stays listed below.
link-libraries = ["MachBug", "Catch2::Catch2WithMain", "machbug_mig", "machdbg_register_format"]
compile-definitions = ['MACHBUG_TESTS_TARGETS_DIR="${CMAKE_BINARY_DIR}/tests/targets"']
properties.RUNTIME_OUTPUT_DIRECTORY = "${CMAKE_BINARY_DIR}/tests"
cmake-after = """
list(APPEND CMAKE_MODULE_PATH "${catch2_SOURCE_DIR}/extras")
include(Catch)
catch_discover_tests(MachBug_tests)

# The targets_signed test reads these fixtures off disk, so building the test binary alone
# (as CI does: `cmake --build ... --target MachBug_tests`) must build and sign them too.
add_dependencies(MachBug_tests
    machbug_fixture_end_immediately
    machbug_fixture_exit_code_42
    machbug_fixture_hello_machbug
    machbug_fixture_run_endlessly
    machbug_fixture_known_globals
    machbug_fixture_known_function
    machbug_fixture_multi_threaded
    machbug_fixture_crash_bad_access
    machbug_fixture_no_get_task_allow
)
"""
